[package]
name = "aletheia-egregore"
version = "0.1.0"
edition = "2024"
default-run = "egregore"
rust-version = "1.92"
authors = ["Egregore Contributors"]
description = "AletheiaDB-backed knowledge graph substrate for agentic software engineering"
license = "MIT OR Apache-2.0"
repository = "https://github.com/madmax983/aletheia-egregore"
keywords = ["agents", "codegraph", "knowledge-graph", "aletheiadb"]
categories = ["development-tools", "parser-implementations"]

[[bin]]
name = "egregore"
path = "src/main.rs"

[[bin]]
name = "eg"
path = "src/bin/eg.rs"

[features]
default = ["embedded-aletheiadb", "embeddings"]
embedded-aletheiadb = [
    "dep:aletheiadb",
    "aletheiadb/semantic-search",
    "aletheiadb/semantic-temporal",
    "aletheiadb/semantic-diagnostics",
    "dep:rmcp",
    "dep:schemars",
    "dep:tokio",
]
embeddings = ["embedded-aletheiadb", "aletheiadb/embeddings", "dep:tokio"]
nova = ["embedded-aletheiadb", "aletheiadb/nova"]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"

[dependencies]
aletheiadb = { version = "0.1.1", default-features = false, optional = true }
anyhow = "1.0.102"
blake3 = "1.8.3"
chrono = { version = "0.4.42", default-features = false, features = ["std", "clock"] }
clap = { version = "4.6.1", features = ["derive"] }
rand = "0.8.6"
same-file = "1.0.6"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
# TOML parsing for Cargo manifest/lockfile dependency extraction (issue #180).
# Already present transitively in Cargo.lock, so this pins no new crate
# version; parse-only (no `display`) keeps the serializer out of the tree.
toml_edit = { version = "0.25", default-features = false, features = ["parse"] }
# Cargo-semantics version-requirement matching for lockfile resolution of
# `package = "…"` rename pairs (issue #180 / PR #314 review). Already present
# transitively in Cargo.lock, so this pins no new crate version.
semver = "1.0.28"
# Unicode XID tables for Cargo's package-name validity rule (PR #314 review).
# Already present transitively in Cargo.lock (via proc-macro2), so this pins
# no new crate version.
unicode-ident = "1.0.24"
rmcp = { version = "1.7.0", features = ["macros", "server", "transport-io"], optional = true }
schemars = { version = "1", optional = true }
tokio = { version = "1", features = ["rt-multi-thread"], optional = true }
ureq = "2.12"
tree-sitter = "0.26.8"
tree-sitter-rust = "0.24.2"
tree-sitter-python = "0.25.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-go = "0.25.0"
tempfile = "3.27.0"

# Unix-only: O_NOFOLLOW / O_NONBLOCK flags for no-follow source opens in the
# protected-artifact capture/get paths.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
assert_cmd = "2.1.2"
predicates = "3.1.4"
tempfile = "3.27.0"

[profile.dev]
debug = 1
