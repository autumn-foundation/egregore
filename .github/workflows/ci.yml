name: CI

on:
  pull_request:
  push:
    branches: [trunk]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt-clippy:
    name: fmt + clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: test (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            flags: ""
          - name: no-default-features
            flags: "--no-default-features"
          - name: nova
            flags: "--features nova"
          - name: all-features
            flags: "--all-features"
    steps:
      - uses: actions/checkout@v4
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2-v1
      # Two threads, not four. Much of this suite drives real embedded
      # AletheiaDB stores — in-process and through spawned `eg` subprocesses —
      # and each store runs a background group-commit flush thread whose
      # acknowledgement path gives up after ~10s. Four-way parallelism put
      # enough concurrent fsync pressure on a shared runner to surface as
      # spurious store corruption on reopen (interner-index and version-chain
      # mismatches) in tests that pass reliably in isolation. The in-crate
      # store gate already caps concurrent in-process stores at two; this
      # matches the subprocess-driven tests to the same bound.
      - name: test
        run: cargo test --all-targets ${{ matrix.flags }} -- --test-threads=2

  query-latency:
    name: cold query-latency budget
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: query-latency
      - name: build
        # The budget is a product-latency promise, so it is measured on the
        # optimised binary: an unoptimised build runs the embedded engine's
        # index load and WAL replay several times slower and would gate
        # compiler settings rather than the code.
        run: cargo build --release
      - name: cold query-latency gate
        # Full two-source gate (issue #255): 11 cold samples each of
        # `eg query symbol` against --graph <JSONL> and --data-dir <embedded
        # store> on the pinned reference corpus
        # (corpus/query_latency_corpus.json, ~10k records). Fails when any
        # source p50 exceeds the 2s budget.
        run: ./target/release/egregore audit query-latency

  query-budget:
    name: structural query latency budget + scaling gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Expected-red until the optimization slice lands (issue #120 is the
    # measurement slice; current scaling is ~10x vs the 2.0x ceiling because
    # the query path loads the whole store per invocation). The failure stays
    # visible in the UI without blocking CI; remove this once the gate is green.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: query-budget
      - name: install ripgrep
        # The benchmark records a ripgrep baseline for the equivalent symbol
        # lookup; without rg on PATH the baseline is an explicit skip, but
        # the reference run should measure it.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep
      - name: build
        run: cargo build
      - name: query-budget gate
        # Full gate (issue #120): cold+warm `eg query symbol` /
        # `eg query file` / `eg query drift` against 1x and 10x fixture
        # stores (corpus/query_budget_corpus.json, ~10k / ~100k records),
        # plus the ripgrep baseline for the equivalent symbol lookup. Fails
        # when the cold symbol 10x/1x p50 ratio exceeds 2.0x (the scaling
        # assertion); the absolute p95 budget is advisory and never fails
        # the gate.
        run: ./target/debug/egregore audit query-budget
